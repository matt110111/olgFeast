services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: olgfeast_test
      POSTGRES_USER: olgfeast
      POSTGRES_PASSWORD: test-only-password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olgfeast -d olgfeast_test']
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./fastapi_app
    environment:
      DATABASE_URL: postgresql://olgfeast:test-only-password@db:5432/olgfeast_test
      SECRET_KEY: isolated-ci-test-signing-key
      DEBUG: 'false'
      ENVIRONMENT: test
      ALLOWED_HOSTS: '["http://127.0.0.1:3002"]'
    ports: ['127.0.0.1:8002:8000']
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:3002:80']
    depends_on:
      backend: {condition: service_healthy}
