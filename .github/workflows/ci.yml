name: Required checks
on:
  push:
    branches: [main, master, event-tablets]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: fastapi_app/requirements.txt}
      - run: pip install -r fastapi_app/requirements.txt
      - run: python -m pytest tests --cov=app --cov-report=xml
        working-directory: fastapi_app
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
  event-integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      E2E_ADMIN_PASSWORD: ci-only-organizer-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: docker compose -f compose.ci.yml up -d --build --wait --wait-timeout 180
      - run: docker compose -f compose.ci.yml exec -T -e E2E_ADMIN_PASSWORD backend python seed_test.py
      - run: npm ci && npx playwright install --with-deps chromium webkit && npx playwright test -c playwright.event.config.ts
        working-directory: frontend
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install httpx && python scripts/check_concurrency.py && python scripts/check_room_load.py
        env:
          E2E_ALLOW_TEST_WRITES: '1'
      - name: Logs
        if: failure()
        run: docker compose -f compose.ci.yml logs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-results, path: frontend/playwright-report, retention-days: 7}
      - name: Stop isolated test services
        if: always()
        run: docker compose -f compose.ci.yml down --volumes
  publish:
    needs: [backend, frontend, event-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
