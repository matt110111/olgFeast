services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: olgfeast_db
    environment:
      POSTGRES_DB: olgfeast
      POSTGRES_USER: olgfeast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olgfeast -d olgfeast"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - olgfeast_network

  # Redis for WebSocket channels
  redis:
    image: redis:7-alpine
    container_name: olgfeast_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - olgfeast_network

  # FastAPI Backend
  backend:
    image: ghcr.io/${GITHUB_OWNER:-matt110111}/olgfeast-backend:${IMAGE_TAG:?Set IMAGE_TAG to a verified sha tag}
    container_name: olgfeast_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ENVIRONMENT: ${ENVIRONMENT}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - olgfeast_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./setup_database.py:/app/setup_database.py:ro

  # React Frontend
  frontend:
    image: ghcr.io/${GITHUB_OWNER:-matt110111}/olgfeast-frontend:${IMAGE_TAG:?Set IMAGE_TAG to a verified sha tag}
    container_name: olgfeast_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - olgfeast_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  olgfeast_network:
    driver: bridge
    name: olgfeast_network
