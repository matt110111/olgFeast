# Optional development overrides. Production uses -f docker-compose.yml explicitly.
services:
  backend:
    environment:
      DEBUG: 'true'
      ENVIRONMENT: development
    volumes:
      - ./fastapi_app:/app
    command: sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports: !override
      - '3001:3000'
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on: [backend]
