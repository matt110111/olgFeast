# Isolated rehearsal against a restored copy of the production database.
services:
  preview-backend:
    image: olgfeast-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/olgfeast_preview
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 'false'
      ALLOWED_HOSTS: '["http://127.0.0.1:3002"]'
    ports: ['127.0.0.1:8002:8000']
    networks: [existing]
  preview-frontend:
    image: olgfeast-frontend
    volumes: ['/tmp/olgfeast-preview-nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:3002:80']
    depends_on: [preview-backend]
    networks: [existing]
networks:
  existing:
    external: true
    name: olgfeast_network
